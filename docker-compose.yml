services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reaproveita-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    env_file:
      - path: .env.local
        required: false
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
